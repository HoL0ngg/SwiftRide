services:
  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Jwt__Issuer: ${JWT_ISSUER:?Set JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      ReverseProxy__Clusters__trip-service__Destinations__primary__Address: ${TRIP_SERVICE_ADDRESS:-http://trip-service:8080/}
      ReverseProxy__Clusters__matching-service__Destinations__primary__Address: ${MATCHING_SERVICE_ADDRESS:-http://matching-service:8080/}
      RateLimit__PermitLimit: ${RATE_LIMIT_PERMIT_LIMIT:-100}
      RateLimit__WindowSeconds: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RateLimit__QueueLimit: ${RATE_LIMIT_QUEUE_LIMIT:-0}

  trip-service:
    build:
      context: .
      dockerfile: src/TripService/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__TripDB: "Server=sqlserver;Database=TripDB;User Id=sa;Password=${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD};TrustServerCertificate=True;Connect Timeout=30"
    depends_on:
      sqlserver:
        condition: service_healthy

  matching-service:
    build:
      context: .
      dockerfile: src/MatchingService/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # URL-encode special characters in MongoDB credentials used in the URI.
      ConnectionStrings__MatchDB: "mongodb://${MONGO_USERNAME:?Set MONGO_USERNAME}:${MONGO_PASSWORD:?Set MONGO_PASSWORD}@mongodb:27017/MatchDB?authSource=admin&connectTimeoutMS=30000&serverSelectionTimeoutMS=30000&socketTimeoutMS=30000"
      MongoDB__Database: MatchDB
    depends_on:
      mongodb:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: src/PaymentService/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__PaymentDB: "Host=postgres;Database=PayDB;Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};Timeout=30;Command Timeout=30"
    depends_on:
      postgres:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD}
    # Initialize the owned database only; no schemas or migrations.
    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        server_pid=$$!
        until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -l 5 -Q "SELECT 1" >/dev/null 2>&1; do
          kill -0 "$$server_pid" || exit 1
          sleep 2
        done
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "IF DB_ID(N'TripDB') IS NULL CREATE DATABASE TripDB" || exit 1
        wait "$$server_pid"
    volumes:
      - trip-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -d TripDB -l 5 -b -Q \"SELECT 1\" >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?Set MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: MatchDB
    volumes:
      - match-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"quit(db.adminCommand({ping:1}).ok ? 0 : 1)\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: PayDB
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d PayDB"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    profiles: ["messaging"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  trip-data:
  match-data:
  payment-data:
